<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Discount Calculator</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #fafafa;
  color: #1c1c1c;
  padding: 40px 20px;
}
.card {
  max-width: 520px;
  margin: 0 auto;
  background: #ffffff;
  border: 1px solid #e4e4e4;
  border-radius: 10px;
  padding: 28px 32px;
}
h1 {
  font-size: 1.5rem;
  margin: 0 0 4px 0;
}
.sub {
  color: #6b6b6b;
  font-size: 0.9rem;
  margin-bottom: 20px;
}
button {
  background: #16a085;
  color: #fff;
  border: none;
  padding: 9px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.95rem;
}
button:hover { filter: brightness(0.92); }
button:disabled { background: #ccc; cursor: not-allowed; }
input, textarea, select {
  padding: 8px 10px;
  border: 1px solid #d0d0d0;
  border-radius: 6px;
  font-size: 0.95rem;
  width: 100%;
}
.row { display: flex; gap: 8px; margin-bottom: 12px; }
.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid #ececec;
  border-radius: 6px;
  margin-bottom: 8px;
}
.tag { font-size: 0.75rem; color: #888; }

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState } = React;

function App() {
  const [price, setPrice] = useState("");
  const [discount, setDiscount] = useState("10");

  const p = parseFloat(price) || 0;
  const d = Math.min(100, Math.max(0, parseFloat(discount) || 0));
  const discountAmount = p * (d / 100);
  const finalPrice = p - discountAmount;

  return (
    <div className="card">
      <h1>Discount Calculator</h1>
      <div className="sub">Enter a price and discount percentage.</div>
      <div className="row">
        <input type="number" value={price} onChange={e => setPrice(e.target.value)} placeholder="Original price" />
      </div>
      <div className="row">
        <input type="range" min="0" max="100" value={d} onChange={e => setDiscount(e.target.value)} />
        <span style={{minWidth:"48px", textAlign:"right"}}>{d}%</span>
      </div>
      <div style={{background:"#eee", borderRadius:"6px", height:"10px", overflow:"hidden", marginBottom:"16px"}}>
        <div style={{background:"#16a085", height:"100%", width: d + "%"}}></div>
      </div>
      <p>Discount: <b>{discountAmount.toFixed(2)}</b></p>
      <p style={{fontSize:"1.3rem", fontWeight:700}}>Final Price: {finalPrice.toFixed(2)}</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
