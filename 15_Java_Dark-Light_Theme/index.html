<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theme Switcher</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #fafafa;
  color: #1c1c1c;
  padding: 40px 20px;
}
.card {
  max-width: 520px;
  margin: 0 auto;
  background: #ffffff;
  border: 1px solid #e4e4e4;
  border-radius: 10px;
  padding: 28px 32px;
}
h1 {
  font-size: 1.5rem;
  margin: 0 0 4px 0;
}
.sub {
  color: #6b6b6b;
  font-size: 0.9rem;
  margin-bottom: 20px;
}
button {
  background: #333;
  color: #fff;
  border: none;
  padding: 9px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.95rem;
}
button:hover { filter: brightness(0.92); }
button:disabled { background: #ccc; cursor: not-allowed; }
input, textarea, select {
  padding: 8px 10px;
  border: 1px solid #d0d0d0;
  border-radius: 6px;
  font-size: 0.95rem;
  width: 100%;
}
.row { display: flex; gap: 8px; margin-bottom: 12px; }
.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid #ececec;
  border-radius: 6px;
  margin-bottom: 8px;
}
.tag { font-size: 0.75rem; color: #888; }

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState } = React;

function App() {
  const [dark, setDark] = useState(false);

  const cardStyle = {
    maxWidth: "480px", margin: "0 auto", borderRadius: "10px", padding: "40px 32px",
    textAlign: "center", transition: "background 0.3s, color 0.3s",
    background: dark ? "#1c1c1c" : "#ffffff",
    color: dark ? "#f5f5f5" : "#1c1c1c",
    border: dark ? "1px solid #333" : "1px solid #e4e4e4"
  };

  return (
    <div style={cardStyle}>
      <h1>Theme Switcher</h1>
      <p className="sub" style={{color: dark ? "#aaa" : "#6b6b6b"}}>
        Hello! Toggle between light and dark mode.
      </p>
      <button onClick={() => setDark(!dark)}
              style={{background: dark ? "#f5c518" : "#333", color: dark ? "#1c1c1c" : "#fff"}}>
        Switch to {dark ? "Light" : "Dark"} Mode
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
