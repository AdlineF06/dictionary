<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calendar Picker</title>
<style>

* { box-sizing: border-box; }
body {
  margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
  background: #fafafa; color: #1c1c1c; padding: 40px 20px;
}
.card { max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #e4e4e4; border-radius: 10px; padding: 28px 32px; }
h1 { font-size: 1.5rem; margin: 0 0 4px 0; }
.sub { color: #6b6b6b; font-size: 0.9rem; margin-bottom: 20px; }
button { background: #16a085; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
button:hover { filter: brightness(0.92); }
input, textarea, select { padding: 8px 10px; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 0.95rem; width: 100%; }
.row { display: flex; gap: 8px; margin-bottom: 12px; }
.list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid #ececec; border-radius: 6px; margin-bottom: 8px; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }

.cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-grid .dow { font-size: 0.8rem; color: #888; padding: 4px 0; }
.cal-grid button { background: #fff; color: #1c1c1c; border: 1px solid #eee; padding: 8px 0; border-radius: 4px; }
.cal-grid button:hover { background: #eafaf3; }
.cal-grid button.selected { background: #16a085; color: #fff; }

</style>
</head>
<body>

<div class="card" style="max-width:340px;">
  <h1>Calendar Picker</h1>
  <div class="sub" id="selectedLabel">No date selected</div>
  <div class="cal-header">
    <button onclick="changeMonth(-1)" style="width:auto;">&lt; Prev</button>
    <span id="monthLabel" style="font-weight:600;"></span>
    <button onclick="changeMonth(1)" style="width:auto;">Next &gt;</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<script>

let today = new Date();
let viewYear = today.getFullYear();
let viewMonth = today.getMonth();
let selectedDate = null;

function render() {
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("monthLabel").textContent = monthNames[viewMonth] + " " + viewYear;

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  ["Mo","Tu","We","Th","Fr","Sa","Su"].forEach(d => {
    const el = document.createElement("div");
    el.className = "dow";
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(viewYear, viewMonth, 1);
  let startOffset = firstDay.getDay() - 1;
  if (startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  for (let i = 0; i < startOffset; i++) {
    grid.appendChild(document.createElement("div"));
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const btn = document.createElement("button");
    btn.textContent = d;
    if (selectedDate && selectedDate.y === viewYear && selectedDate.m === viewMonth && selectedDate.d === d) {
      btn.className = "selected";
    }
    btn.onclick = () => pick(d);
    grid.appendChild(btn);
  }
}

function pick(d) {
  selectedDate = { y: viewYear, m: viewMonth, d };
  document.getElementById("selectedLabel").textContent =
    "Selected: " + viewYear + "-" + String(viewMonth+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
  render();
}

function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  render();
}

render();

</script>
</body>
</html>
