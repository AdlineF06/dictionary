<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Temperature Converter & Timer</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #fafafa;
  color: #1c1c1c;
  padding: 40px 20px;
}
.card {
  max-width: 520px;
  margin: 0 auto;
  background: #ffffff;
  border: 1px solid #e4e4e4;
  border-radius: 10px;
  padding: 28px 32px;
}
h1 {
  font-size: 1.5rem;
  margin: 0 0 4px 0;
}
.sub {
  color: #6b6b6b;
  font-size: 0.9rem;
  margin-bottom: 20px;
}
button {
  background: #e07a3f;
  color: #fff;
  border: none;
  padding: 9px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.95rem;
}
button:hover { filter: brightness(0.92); }
button:disabled { background: #ccc; cursor: not-allowed; }
input, textarea, select {
  padding: 8px 10px;
  border: 1px solid #d0d0d0;
  border-radius: 6px;
  font-size: 0.95rem;
  width: 100%;
}
.row { display: flex; gap: 8px; margin-bottom: 12px; }
.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid #ececec;
  border-radius: 6px;
  margin-bottom: 8px;
}
.tag { font-size: 0.75rem; color: #888; }

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef } = React;

function App() {
  const [mode, setMode] = useState("c2f");
  const [value, setValue] = useState("");
  const [result, setResult] = useState(null);

  const [seconds, setSeconds] = useState(60);
  const [remaining, setRemaining] = useState(0);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  function convert() {
    const v = parseFloat(value);
    if (isNaN(v)) { setResult(null); return; }
    if (mode === "c2f") setResult((v * 9/5 + 32).toFixed(2) + " F");
    else setResult(((v - 32) * 5/9).toFixed(2) + " C");
  }

  function startTimer() {
    if (running) return;
    setRemaining(seconds);
    setRunning(true);
  }

  function stopTimer() {
    setRunning(false);
    clearInterval(intervalRef.current);
  }

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => {
        setRemaining(r => {
          if (r <= 1) {
            clearInterval(intervalRef.current);
            setRunning(false);
            return 0;
          }
          return r - 1;
        });
      }, 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [running]);

  return (
    <div className="card">
      <h1>Temperature Converter & Timer</h1>
      <div className="sub">Convert temperatures and run a countdown timer.</div>

      <div className="row">
        <select value={mode} onChange={e => setMode(e.target.value)}>
          <option value="c2f">Celsius to Fahrenheit</option>
          <option value="f2c">Fahrenheit to Celsius</option>
        </select>
      </div>
      <div className="row">
        <input type="number" value={value} onChange={e => setValue(e.target.value)} placeholder="Enter value" />
        <button onClick={convert}>Convert</button>
      </div>
      {result !== null && <p style={{fontWeight:600}}>Result: {result}</p>}

      <hr style={{margin:"20px 0", border:"none", borderTop:"1px solid #eee"}} />

      <h1 style={{fontSize:"1.1rem"}}>Timer</h1>
      <div className="row">
        <input type="number" value={seconds} onChange={e => setSeconds(parseInt(e.target.value) || 0)}
               disabled={running} placeholder="Seconds" />
        <button onClick={startTimer} disabled={running}>Start</button>
        <button onClick={stopTimer} disabled={!running} style={{background:"#c0392b"}}>Stop</button>
      </div>
      <p style={{fontSize:"1.8rem", fontWeight:700}}>{remaining}s</p>
      {remaining === 0 && !running && seconds > 0 && <div className="sub">Ready. Press Start.</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
