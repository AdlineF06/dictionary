<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To-Do List</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #fafafa;
  color: #1c1c1c;
  padding: 40px 20px;
}
.card {
  max-width: 520px;
  margin: 0 auto;
  background: #ffffff;
  border: 1px solid #e4e4e4;
  border-radius: 10px;
  padding: 28px 32px;
}
h1 {
  font-size: 1.5rem;
  margin: 0 0 4px 0;
}
.sub {
  color: #6b6b6b;
  font-size: 0.9rem;
  margin-bottom: 20px;
}
button {
  background: #3f6fd6;
  color: #fff;
  border: none;
  padding: 9px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.95rem;
}
button:hover { filter: brightness(0.92); }
button:disabled { background: #ccc; cursor: not-allowed; }
input, textarea, select {
  padding: 8px 10px;
  border: 1px solid #d0d0d0;
  border-radius: 6px;
  font-size: 0.95rem;
  width: 100%;
}
.row { display: flex; gap: 8px; margin-bottom: 12px; }
.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid #ececec;
  border-radius: 6px;
  margin-bottom: 8px;
}
.tag { font-size: 0.75rem; color: #888; }

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState } = React;

function App() {
  const [tasks, setTasks] = useState([]);
  const [text, setText] = useState("");
  const [editIdx, setEditIdx] = useState(null);
  const [editText, setEditText] = useState("");

  function addTask() {
    if (!text.trim()) return;
    setTasks([...tasks, text.trim()]);
    setText("");
  }

  function deleteTask(i) {
    setTasks(tasks.filter((_, idx) => idx !== i));
  }

  function startEdit(i) {
    setEditIdx(i);
    setEditText(tasks[i]);
  }

  function saveEdit(i) {
    const copy = [...tasks];
    copy[i] = editText;
    setTasks(copy);
    setEditIdx(null);
  }

  return (
    <div className="card">
      <h1>To-Do List</h1>
      <div className="sub">Manage your tasks: add, edit, delete.</div>
      <div className="row">
        <input value={text} onChange={e => setText(e.target.value)}
               placeholder="New task..." onKeyDown={e => e.key === "Enter" && addTask()} />
        <button onClick={addTask}>Add</button>
      </div>
      {tasks.length === 0 && <div className="sub">No tasks yet — add one above.</div>}
      {tasks.map((t, i) => (
        <div className="list-item" key={i}>
          {editIdx === i ? (
            <>
              <input value={editText} onChange={e => setEditText(e.target.value)} />
              <button onClick={() => saveEdit(i)}>Save</button>
            </>
          ) : (
            <>
              <span>{t}</span>
              <div style={{display:"flex", gap:"6px"}}>
                <button onClick={() => startEdit(i)}>Edit</button>
                <button onClick={() => deleteTask(i)} style={{background:"#c0392b"}}>Delete</button>
              </div>
            </>
          )}
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
