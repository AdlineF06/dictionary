<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Book</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #fafafa;
  color: #1c1c1c;
  padding: 40px 20px;
}
.card {
  max-width: 520px;
  margin: 0 auto;
  background: #ffffff;
  border: 1px solid #e4e4e4;
  border-radius: 10px;
  padding: 28px 32px;
}
h1 {
  font-size: 1.5rem;
  margin: 0 0 4px 0;
}
.sub {
  color: #6b6b6b;
  font-size: 0.9rem;
  margin-bottom: 20px;
}
button {
  background: #2f9e6e;
  color: #fff;
  border: none;
  padding: 9px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.95rem;
}
button:hover { filter: brightness(0.92); }
button:disabled { background: #ccc; cursor: not-allowed; }
input, textarea, select {
  padding: 8px 10px;
  border: 1px solid #d0d0d0;
  border-radius: 6px;
  font-size: 0.95rem;
  width: 100%;
}
.row { display: flex; gap: 8px; margin-bottom: 12px; }
.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid #ececec;
  border-radius: 6px;
  margin-bottom: 8px;
}
.tag { font-size: 0.75rem; color: #888; }

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState } = React;

function App() {
  const [contacts, setContacts] = useState([]);
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [query, setQuery] = useState("");

  function addContact() {
    if (!name.trim() || !phone.trim()) return;
    setContacts([...contacts, { name: name.trim(), phone: phone.trim() }]);
    setName(""); setPhone("");
  }

  function deleteContact(i) {
    setContacts(contacts.filter((_, idx) => idx !== i));
  }

  const filtered = contacts.filter(c => c.name.toLowerCase().includes(query.toLowerCase()));

  return (
    <div className="card">
      <h1>Contact Book</h1>
      <div className="sub">Add and search your contacts.</div>
      <div className="row">
        <input value={name} onChange={e => setName(e.target.value)} placeholder="Name" />
        <input value={phone} onChange={e => setPhone(e.target.value)} placeholder="Phone" />
      </div>
      <button onClick={addContact} style={{marginBottom:"16px"}}>Add Contact</button>

      <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search by name..."
             style={{marginBottom:"12px"}} />

      {filtered.length === 0 && <div className="sub">No contacts found.</div>}
      {filtered.map((c, i) => (
        <div className="list-item" key={i}>
          <div>
            <div style={{fontWeight:600}}>{c.name}</div>
            <div className="tag">{c.phone}</div>
          </div>
          <button onClick={() => deleteContact(contacts.indexOf(c))} style={{background:"#c0392b"}}>Delete</button>
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
