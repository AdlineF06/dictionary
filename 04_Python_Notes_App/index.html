<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sticky Notes</title>
<style>

* { box-sizing: border-box; }
body {
  margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
  background: #fafafa; color: #1c1c1c; padding: 40px 20px;
}
.card { max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #e4e4e4; border-radius: 10px; padding: 28px 32px; }
h1 { font-size: 1.5rem; margin: 0 0 4px 0; }
.sub { color: #6b6b6b; font-size: 0.9rem; margin-bottom: 20px; }
button { background: #f1c40f; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
button:hover { filter: brightness(0.92); }
input, textarea, select { padding: 8px 10px; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 0.95rem; width: 100%; }
.row { display: flex; gap: 8px; margin-bottom: 12px; }
.list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid #ececec; border-radius: 6px; margin-bottom: 8px; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }

.notes-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.note { background: #fff8c4; border: 1px solid #eede8a; border-radius: 6px; padding: 12px; width: 150px; min-height: 100px; position: relative; }
.note button { position: absolute; bottom: 8px; right: 8px; background: #c0392b; padding: 4px 8px; font-size: 0.75rem; }

</style>
</head>
<body>

<div class="card" style="max-width:640px;">
  <h1>Sticky Notes</h1>
  <div class="sub">Write quick notes — stored in this browser tab only.</div>
  <div class="row">
    <textarea id="noteInput" rows="2" placeholder="Write a note..."></textarea>
    <button onclick="addNote()">Add</button>
  </div>
  <div id="notesGrid" class="notes-grid"></div>
</div>

<script>

let notes = [];
function render() {
  const grid = document.getElementById("notesGrid");
  grid.innerHTML = "";
  notes.forEach((n, i) => {
    const div = document.createElement("div");
    div.className = "note";
    div.innerHTML = n.replace(/</g, "&lt;") + '<button onclick="deleteNote(' + i + ')">Delete</button>';
    grid.appendChild(div);
  });
}
function addNote() {
  const input = document.getElementById("noteInput");
  if (input.value.trim()) {
    notes.push(input.value.trim());
    input.value = "";
    render();
  }
}
function deleteNote(i) { notes.splice(i, 1); render(); }
render();

</script>
</body>
</html>
