<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Finder</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #fafafa;
  color: #1c1c1c;
  padding: 40px 20px;
}
.card {
  max-width: 520px;
  margin: 0 auto;
  background: #ffffff;
  border: 1px solid #e4e4e4;
  border-radius: 10px;
  padding: 28px 32px;
}
h1 {
  font-size: 1.5rem;
  margin: 0 0 4px 0;
}
.sub {
  color: #6b6b6b;
  font-size: 0.9rem;
  margin-bottom: 20px;
}
button {
  background: #6d4aff;
  color: #fff;
  border: none;
  padding: 9px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.95rem;
}
button:hover { filter: brightness(0.92); }
button:disabled { background: #ccc; cursor: not-allowed; }
input, textarea, select {
  padding: 8px 10px;
  border: 1px solid #d0d0d0;
  border-radius: 6px;
  font-size: 0.95rem;
  width: 100%;
}
.row { display: flex; gap: 8px; margin-bottom: 12px; }
.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid #ececec;
  border-radius: 6px;
  margin-bottom: 8px;
}
.tag { font-size: 0.75rem; color: #888; }

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState } = React;

function App() {
  const [query, setQuery] = useState("");
  const [books, setBooks] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  async function search() {
    if (!query.trim()) return;
    setLoading(true);
    setError(null);
    try {
      const res = await fetch("https://www.googleapis.com/books/v1/volumes?q=" + encodeURIComponent(query));
      const data = await res.json();
      setBooks((data.items || []).slice(0, 10));
    } catch (e) {
      setError("Could not reach Google Books API. Check your internet connection.");
    }
    setLoading(false);
  }

  return (
    <div className="card" style={{maxWidth:"600px"}}>
      <h1>Book Finder</h1>
      <div className="sub">Search Google Books (live API — requires internet).</div>
      <div className="row">
        <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search by title or author..."
               onKeyDown={e => e.key === "Enter" && search()} />
        <button onClick={search}>Search</button>
      </div>
      {loading && <div className="sub">Searching...</div>}
      {error && <div style={{color:"#c0392b"}}>{error}</div>}
      {books.map((b, i) => {
        const info = b.volumeInfo || {};
        const thumb = info.imageLinks && info.imageLinks.thumbnail;
        return (
          <div key={i} style={{display:"flex", gap:"12px", padding:"10px 0", borderBottom:"1px solid #eee"}}>
            {thumb && <img src={thumb} alt="" style={{width:"48px", height:"70px", objectFit:"cover"}} />}
            <div>
              <div style={{fontWeight:600}}>{info.title}</div>
              <div className="tag">{(info.authors || []).join(", ")}</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
